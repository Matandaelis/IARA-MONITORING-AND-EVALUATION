services: monic-db: image: mcr.microsoft.com/mssql/server:2022-latest restart: unless-stopped environment: ACCEPT_EULA: "Y" MSSQL_PID: Express MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify} volumes: - monic-db-data:/var/opt/mssql healthcheck: test: - CMD-SHELL - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null interval: 10s timeout: 10s retries: 10 start_period: 60s azurite: image: mcr.microsoft.com/azure-storage/azurite:latest restart: unless-stopped command: azurite --blobHost 0.0.0.0 --blobPort 10000 --location /data --debug /data/debug.log volumes: - azurite-data:/data expose: - "10000" healthcheck: test: - CMD - node - -e - "fetch('http://127.0.0.1:10000/devstoreaccount1?comp=list').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))" interval: 10s timeout: 5s retries: 10 start_period: 20s monic-app: build: context: . dockerfile: Dockerfile restart: unless-stopped depends_on: monic-db: condition: service_healthy azurite: condition: service_healthy environment: ASPNETCORE_ENVIRONMENT: Production ASPNETCORE_URLS: http://+:80 ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true" ConnectionStrings__DefaultConnection: "Server=monic-db,1433;Database=MONIC;User Id=sa;Password=${DB_PASSWORD:?};Encrypt=True;TrustServerCertificate=True;" Settings__UseAzureInfrastructure: "false" Settings__RootUrl: ${PUBLIC_URL:?Set PUBLIC_URL in Coolify} Settings__SiteName: MONIC Settings__CertificatePassword: ${CERTIFICATE_PASSWORD:?Set CERTIFICATE_PASSWORD in Coolify} Settings__AzureSettings__Documents__ConnectionString: "UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://azurite" Settings__AzureSettings__Documents__ContainerName: docs Settings__EmailSettings__SendEmails: "false" Settings__EmailSettings__SendErrorEmails: "false" expose: - "80" volumes: - monic-app-data:/app/data healthcheck: test: ["CMD", "curl", "--fail", "http://localhost/health"] interval: 30s timeout: 10s retries: 5 start_period: 60s volumes: monic-db-data: azurite-data: monic-app-data: