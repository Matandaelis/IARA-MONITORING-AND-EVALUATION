<div class="mt-6">

    <!-- Onboarding banner -->
    <div class="alert alert-info alert-dismissible fade show" *ngIf="showOnboardingBanner" role="alert">
        <h6 class="alert-heading"><i class="fas fa-rocket me-2"></i>Welcome to MONIC! Finish setting up:</h6>
        <ol class="mb-2">
            <li>Complete your <a routerLink="/account">profile</a> (name, picture, default org unit)</li>
            <li>Explore the <a routerLink="/dataentry">Data Entry</a> page or your assigned questionnaires</li>
            <li>Review <a routerLink="/budget">Budget & Expenditures</a> if you manage finances</li>
        </ol>
        <button type="button" class="btn btn-sm btn-outline-primary" (click)="dismissOnboardingBanner()" [disabled]="dismissingBanner">
            <i class="fas fa-check me-2"></i>Done — don't show again
        </button>
    </div>

    <div class="row" *ngIf="profile">

        <ng-container *ngFor="let settings of profile.dashboardSettings">
            <app-widget [settings]="settings"></app-widget>
        </ng-container>

        <div class="col-12" *ngIf="(profile?.dashboardSettings?.length ?? 0) === 0">
            <div class="card card-primary">
                <div class="card-body">
                    <div class="text-center my-6">

                        <div class="my-4">You do not have any dashboard widgets configured.</div>

                        <div class="btn-group" ngbDropdown>

                            <button type="button" class="btn btn-outline-secondary" ngbDropdownToggle>
                                Add a dashboard widget
                            </button>

                            <div class="dropdown-menu dropdown-menu-end" ngbDropdownMenu>

                                <div *ngFor="let widgetType of widgetTypes">
                                    <button type="button" class="dropdown-item" (click)="addWidget(widgetType)">
                                        {{ widgetType.label }}
                                    </button>
                                </div>

                            </div>

                        </div>

                    </div>
                </div>
            </div>
        </div>

        <div class="col-6 col-sm-4 col-md-3 col-lg-2 col-xl-1 widget" ngbDropdown *ngIf="(profile?.dashboardSettings?.length ?? 0) !== 0">

            <button id="add-widget" type="button" class="btn btn-outline-secondary no-arrow d-inline-block show-icons" ngbDropdownToggle><i class="fa fa-plus"></i></button>

            <div class="dropdown-menu dropdown-menu-end" ngbDropdownMenu>

                <div *ngFor="let widgetType of widgetTypes">
                    <button type="button" class="dropdown-item" (click)="addWidget(widgetType)">
                        {{ widgetType.label }}
                    </button>
                </div>

            </div>

        </div>

    </div>

</div>
